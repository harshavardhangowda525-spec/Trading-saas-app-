name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chartsense
          POSTGRES_PASSWORD: chartsense
          POSTGRES_DB: chartsense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chartsense"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://chartsense:chartsense@localhost:5432/chartsense
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      IP_HASH_SALT: ci-only-salt
      EMAIL_TRANSPORT: console
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
